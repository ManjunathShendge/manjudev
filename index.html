<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#08070C" />
    <title>Manjunath P Shendge — Software Engineer</title>
    <meta
      name="description"
      content="Full-stack engineer in Bengaluru building production web platforms — React and Next.js on the surface, APIs, schemas and data pipelines underneath."
    />
  </head>
  <body>
    <!--
      Netlify Forms detection runs against the built HTML, and it cannot see a
      form that React renders at runtime. This hidden twin is what registers the
      form; the real one lives in src/components/LeadForm.tsx and must keep the
      same name and the same field names as this.
    -->
    <form name="project-enquiry" netlify netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="text" name="company" />
      <input type="text" name="services" />
      <textarea name="message"></textarea>
    </form>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
