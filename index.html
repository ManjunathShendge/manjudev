<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      Icons. The 96px PNG covers hi-dpi browser tabs, favicon.ico carries
      16/32/48 for everything older, apple-touch-icon is what iOS saves to the
      home screen, and site.webmanifest holds the Android pair.

      public/favicon.svg ships but is deliberately not linked here. It is the
      same raster image wrapped in an svg element, so a browser that prefers
      SVG icons would fetch 136KB where the PNG is 6KB, for identical pixels.
      Link it back if a true vector mark ever replaces it.
    -->
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="apple-mobile-web-app-title" content="Manjunath" />
    <meta name="theme-color" content="#08070C" />
    <title>Manjunath P Shendge — Software Engineer</title>
    <meta
      name="description"
      content="Full-stack engineer in Bengaluru building production web platforms — React and Next.js on the surface, APIs, schemas and data pipelines underneath."
    />

    <!--
      Link preview card. These tags are read from the raw HTML by scrapers that
      do not run JavaScript, which is why they live here and not in
      useDocumentMeta — that hook covers what crawlers with a JS engine see on
      /blog and /blog/:slug, and cannot help WhatsApp or Slack.

      og:image is relative. Most scrapers resolve that against the page URL,
      but the specification wants an absolute URL and X is the one that holds
      you to it. Once the site has a domain, make these two absolute:
        <meta property="og:image" content="https://your-domain/og.png" />
        <meta name="twitter:image" content="https://your-domain/og.png" />

      public/og.png is generated, not drawn — see scripts/ in the README.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Manjunath P Shendge" />
    <meta property="og:title" content="Manjunath P Shendge — Software Engineer" />
    <meta
      property="og:description"
      content="Full-stack engineer in Bengaluru building production web platforms — React and Next.js on the surface, APIs, schemas and data pipelines underneath."
    />
    <meta property="og:image" content="/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Manjunath P Shendge, software engineer, Bengaluru — portfolio card"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Manjunath P Shendge — Software Engineer" />
    <meta
      name="twitter:description"
      content="React and Next.js on the surface. APIs, schemas and data pipelines underneath."
    />
    <meta name="twitter:image" content="/og.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
